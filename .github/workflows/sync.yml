name: Sync Letterboxd list

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: letterboxd-list-syncer
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install browser-compatible HTTP client
        run: |
          curl -fsSL https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Sync list
        env:
          LETTERBOXD_USER_COOKIE: ${{ secrets.LETTERBOXD_USER_COOKIE }}
          LETTERBOXD_CSRF_COOKIE: ${{ secrets.LETTERBOXD_CSRF_COOKIE }}
        run: cargo run --locked --release
